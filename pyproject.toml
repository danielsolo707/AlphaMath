[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-math-agent"
version = "0.2.2"
description = "Offline tool-integrated math reasoning agent for GPU-constrained evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Daniel Soleimani"}]
dependencies = [
  "sympy>=1.12,<2",
  "numpy>=1.24,<3",
  "pyyaml>=6.0,<7",
  "tqdm>=4.66,<5",
  "rich>=13.0,<15",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.1,<3",
  "transformers>=4.40,<5",
  "accelerate>=0.28,<2",
  "sentencepiece>=0.1.99,<1",
  "protobuf>=4.25,<7",
  "huggingface_hub>=0.22,<2",
  "safetensors>=0.4,<1",
]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.10,<2"]

[project.scripts]
alpha-math-solve = "src.solve:main"
alpha-math-eval = "src.evaluate:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
