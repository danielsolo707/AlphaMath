# Kaggle AIMO submission profile — zero internet, local Qwen2.5-Math weights.
# Matches published kernel: danielsolo1770/alpha-math
#
# Before submit:
#   1. Add Qwen2.5-Math-7B as a Kaggle Model (or Dataset mirror)
#   2. Set model_path to the folder that contains config.json
#      Default mirror used in the notebook:
#      /kaggle/input/models/urvishp80/qwen-2.5-math-7b/transformers/default/1
#   3. Attach competition data: ai-mathematical-olympiad-progress-prize-3
#   4. Turn off internet in the notebook for the final scoring run

competition: ai-mathematical-olympiad-progress-prize-3
answer_min: 0
answer_max: 999

agent:
  max_attempts: 2
  temperature: 0.7
  top_p: 0.9
  timeout_seconds: 180
  majority_vote_k: 3
  clamp_answer: true
  verbose_prompts: false
  default_answer_on_fail: 0

sandbox:
  timeout_seconds: 5
  max_output_chars: 8000
  allowed_modules:
    - math
    - fractions
    - decimal
    - itertools
    - functools
    - collections
    - sympy
    - numpy

llm:
  backend: transformers
  model: Qwen/Qwen2.5-Math-7B-Instruct
  # UPDATE if your attached model path differs:
  model_path: /kaggle/input/models/urvishp80/qwen-2.5-math-7b/transformers/default/1
  local_files_only: true
  load_in_4bit: false
  load_in_8bit: false
  torch_dtype: float16
  device_map: auto
  max_new_tokens: 1024
  trust_remote_code: true
  allow_mock_fallback: false

paths:
  sample_problems: data/sample_problems.json
  results_dir: /kaggle/working/results
  # Auto-discovered if missing; set explicitly when known:
  test_csv: /kaggle/input/ai-mathematical-olympiad-progress-prize-3/test.csv
  submission_csv: /kaggle/working/submission.csv
  # Notebook used "prediction"; AIMO LB sometimes wants "answer" — switch if needed
  answer_column: prediction
