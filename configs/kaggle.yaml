# Kaggle AIMO profile: local weights, no APIs, no network at inference.
competition: ai-mathematical-olympiad-progress-prize-3
answer_min: 0
answer_max: 999

agent:
  max_corrections: 2
  # Cooler sampling favors syntax-stable code for tool execution on hard AIME.
  temperature: 0.5
  top_p: 0.9
  # Hard AIME problems with 3 votes need more wall time than the sanity set.
  time_budget_seconds: 420
  majority_vote_k: 3
  early_stop_majority: true
  seed: 2026
  clamp_answer: true
  verbose_prompts: false
  default_answer_on_fail: 0

sandbox:
  # AIME-style sympy search can exceed 8s; keep hard kill but allow more headroom.
  timeout_seconds: 12
  max_output_chars: 8000
  max_source_chars: 50000
  memory_limit_mb: 1536
  allowed_modules:
    - math
    - fractions
    - decimal
    - itertools
    - functools
    - collections
    - sympy
    - numpy

llm:
  backend: transformers
  model: Qwen/Qwen2.5-Math-7B-Instruct
  model_path: /kaggle/input/models/urvishp80/qwen-2.5-math-7b/transformers/default/1
  local_files_only: true
  # Prefer 4-bit on T4/A10+ (sm_70+). On P100 (sm_60) the loader auto-disables
  # bitsandbytes and falls back to float16 to avoid segfaults.
  load_in_4bit: true
  load_in_8bit: false
  torch_dtype: float16
  device_map: auto
  max_new_tokens: 768
  trust_remote_code: false
  allow_mock_fallback: false
  revision: null

paths:
  sample_problems: data/sample_problems.json
  results_dir: /kaggle/working/alphamath_artifacts
  test_csv: /kaggle/input/ai-mathematical-olympiad-progress-prize-3/test.csv
  submission_csv: /kaggle/working/alphamath_artifacts/submission.csv
  answer_column: prediction
