# ALPHA-MATH default configuration
# AIMO-style integer answers in [0, 999] (AIME convention)

competition: ai-mathematical-olympiad-progress-prize-3
answer_min: 0
answer_max: 999

agent:
  max_attempts: 3
  temperature: 0.2
  timeout_seconds: 8
  majority_vote_k: 1   # set >1 for multi-sample voting when using an LLM

sandbox:
  timeout_seconds: 5
  max_output_chars: 8000
  allowed_modules:
    - math
    - fractions
    - decimal
    - itertools
    - functools
    - collections
    - sympy
    - numpy

llm:
  # backend: mock | openai | openai_compatible | anthropic
  backend: mock
  model: gpt-4o-mini
  base_url: null          # e.g. http://localhost:11434/v1 for Ollama
  api_key_env: OPENAI_API_KEY
  max_tokens: 2048

paths:
  sample_problems: data/sample_problems.json
  results_dir: results
