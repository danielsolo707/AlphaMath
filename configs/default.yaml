# ALPHA-MATH - reproducible local/competition defaults
competition: ai-mathematical-olympiad-progress-prize-3
answer_min: 0
answer_max: 999

agent:
  max_corrections: 2         # one initial generation + two stateful corrections
  temperature: 0.7
  top_p: 0.9
  time_budget_seconds: 180   # checked between generations for each problem
  majority_vote_k: 3
  early_stop_majority: true
  seed: 2026
  clamp_answer: true
  verbose_prompts: false
  default_answer_on_fail: 0

sandbox:
  timeout_seconds: 5
  max_output_chars: 8000
  max_source_chars: 50000
  memory_limit_mb: 1536
  allowed_modules:
    - math
    - fractions
    - decimal
    - itertools
    - functools
    - collections
    - sympy
    - numpy

llm:
  backend: transformers
  model: Qwen/Qwen2.5-Math-7B-Instruct
  model_path: null
  local_files_only: false
  load_in_4bit: false
  load_in_8bit: false
  torch_dtype: float16
  device_map: auto
  max_new_tokens: 1024
  trust_remote_code: false
  allow_mock_fallback: false
  revision: null

paths:
  sample_problems: data/sample_problems.json
  results_dir: results
  answer_column: prediction
